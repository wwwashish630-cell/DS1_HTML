<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<fieldset>

          <Form action="#">

              <Label for="name">username:</label>
              <Input type="text" name="name" id="name" placeholder="enter your name">
              <Br><Br>

              <Label for="pass">password:</label>
              <Input type="password" name="pass" id="pass" placeholder="enter your password">
              <Br><Br>

              <Label for="email">email:</label>
              <Input type="email" name="email" id="email" placeholder="enter your email">
              <Br><Br>

                <Label for="gender">gender:</label>
                <Input type="radio" name="gender" id="male" value="male">
                <Label for="male">male</label>
                <Input type="radio" name="gender" id="female" value="female">
                <Label for="female">female</label>
                <Br><Br>

                    <Label for="Hobbies">what are your hobbies?</label>
                    <Input type="text" name="Hobbies" id="Hobbies" placeholder="enter your hobbies">
                        <Br><Br>

                <Label for="calendar">date of birth:</label>
                <Input type="date" name="calendar" id="calendar">
                <Br><Br>

                <Label for="language">language:</label>
                <Select name="language" id="language">
                    <Option value="c++">c++</option>
                    <Option value="python">python</option>
                    <Option value="java">java</option>
                </Select>
                <Br><Br>

                <label for="tele">Phone:</label>
                <input type="tel" name="tel" id="tel" >

                <br><br>
                <label for="add">Address: </label>
                <textarea name="add" id="add"></textarea>

                <br><br>
                <label for="attmpt">Attempt: </label>
                <input type="number">
            
                <br><br>
                <label for="resume">Upload resume: </label>
                <input type="file" name="resue" id="resume">

                <br><br>
                <input type="submit" value="Submit form">
                <input type="reset">




</fieldset>
</body>
</html>
